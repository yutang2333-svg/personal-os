<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Personal OS · 生活有迹</title><link rel="stylesheet" href="style.css"></head><body><aside><a class="brand" href="#">◒ <span>Personal OS<small>生活有迹 · v0.1</small></span></a><div class="navlabel">我的空间</div><nav><button data-page="overview">◫　每周概览</button><button data-page="records">▤　全部记录</button><button data-page="import">↥　导入数据</button><button data-page="privacy">⚙　数据与隐私</button></nav><div class="asidefoot"><span class="dot"></span> 本地优先<small>记录留在你的浏览器</small></div></aside><main><header><span>PERSONAL SPACE / <b id="crumb">每周概览</b></span><div><select id="mode" aria-label="数据模式"><option value="demo">演示数据</option><option value="personal">我的数据</option></select><button class="primary" id="add">＋ 添加记录</button></div></header><div class="notice" id="notice"></div><div id="app"></div><footer>慢慢记录，慢慢了解自己。<span>Eaten / Speak20 未连接 · 手动或文件导入</span></footer></main><dialog id="editor"><form id="entry"><div class="dialoghead"><h2 id="editorTitle">添加记录</h2><button type="button" id="close">✕</button></div><input name="id" type="hidden"><label>日期<input name="date" type="date" required></label><label>记录类型<select name="type"><option value="meal">饮食 · kcal</option><option value="exercise">运动 · min</option><option value="study">Speak20 学习 · min</option><option value="weight">体重 · kg</option><option value="cycle">生理周期 · 经期一天</option></select></label><label>数值<input name="value" type="number" min="0.01" step="0.01" required></label><label>来源（用户声明）<select name="source"><option value="manual">手动记录</option><option value="Eaten">Eaten 手动转录</option><option value="Speak20">Speak20 手动转录</option></select></label><label>备注<input name="note" maxlength="500" placeholder="例如：午餐 / 快走 / 口语练习"></label><p class="muted">周期填 1，仅记录经期当天；不预测周期。</p><button class="primary">保存记录</button></form></dialog><dialog id="evidence"><div class="dialoghead"><h2>洞察依据</h2><button id="closeEvidence">✕</button></div><div id="evidenceBody"></div></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
